[project]
name = "stockagent"
version = "0.1.0"
description = "Alert-only stock idea agent: TradingAgents analysis, moomoo read-only data, Telegram alerts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "moomoo-api",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents@v0.7.1",
    "langchain",
    "langchain-google-genai",
    "yfinance",
    "python-telegram-bot>=21,<23",
    "apscheduler>=3.10,<4",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "pandas",
]

[project.scripts]
stockagent = "stockagent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/stockagent"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-PyYAML", "pandas-stubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
