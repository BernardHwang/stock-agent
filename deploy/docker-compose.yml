# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  stockagent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true  # forwards SIGTERM so `docker stop` is immediate
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../data/tradingagents:/home/app/.tradingagents
      - ../config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
