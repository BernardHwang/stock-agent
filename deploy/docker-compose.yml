# Run from the repo root:  docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
# Both opend and stockagent share an internal-only Docker network (stocknet).
# OpenD has NO ports published to the host or internet; only stockagent can reach opend:11111.
services:
  opend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.opend
      args:
        OPEND_VERSION: ${OPEND_VERSION:-10.12.7208}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    env_file: ../.env
    volumes:
      - ../data/opend:/home/opend/.com.moomoo.OpenD
    networks:
      - stocknet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  stockagent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true  # forwards SIGTERM so `docker stop` is immediate
    depends_on:
      - opend
    env_file: ../.env
    environment:
      # Override MOOMOO_HOST inside Docker so stockagent always talks to the opend container over stocknet
      MOOMOO_HOST: opend
      MOOMOO_PORT: "11111"
    volumes:
      - ../data:/app/data
      # Hide OpenD's saved login (data/opend) from this container; it only needs the API on opend:11111.
      - type: tmpfs
        target: /app/data/opend
      - ../data/tradingagents:/home/app/.tradingagents
      - ../config:/app/config:ro
    networks:
      - stocknet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  stocknet:
    driver: bridge
